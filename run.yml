                  try {
                    url = await state.api.uploadImage(
                        file: _image!, bucket: Config.bucketAnnouncements);
                  } catch (e) {
                    throw 'تعذر رفع الصورة: $e';
                  }
                }
                await state.api.addAnnouncement(text, url);
                _text.clear();
                _image = null;
                await state.loadAnnouncements();
                if (mounted) {
                  setState(() {
                    _msg = 'تم نشر الإعلان';
                    _msgError = false;
