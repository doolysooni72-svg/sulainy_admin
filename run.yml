          /// شاشة مسح باركود بالكاميرا الحية.
          /// الاستخدام: final code = await scanBarcode(context);
          Future<String?> scanBarcode(BuildContext context) {
            return Navigator.of(context).push<String>(
              MaterialPageRoute(builder: (_) => const BarcodeScannerPage()),
            );
          }

          class BarcodeScannerPage extends StatefulWidget {
            const BarcodeScannerPage({super.key});

            @override
            State<BarcodeScannerPage> createState() => _BarcodeScannerPageState();
          }

          class _BarcodeScannerPageState extends State<BarcodeScannerPage> {
            final MobileScannerController _controller = MobileScannerController(
              detectionSpeed: DetectionSpeed.noDuplicates,
              facing: CameraFacing.back,
              formats: const [
                BarcodeFormat.ean13,
                BarcodeFormat.ean8,
                BarcodeFormat.upcA,
                BarcodeFormat.upcE,
                BarcodeFormat.code128,
                BarcodeFormat.code39,
                BarcodeFormat.qrCode,
              ],
            );
            bool _handled = false;

            @override
            void dispose() {
              _controller.dispose();
              super.dispose();
            }

            void _onDetect(BarcodeCapture capture) {
              if (_handled) return;
              for (final b in capture.barcodes) {
                final v = b.rawValue;
                if (v != null && v.isNotEmpty) {
                  _handled = true;
                  Navigator.of(context).pop(v);
                  return;
                }
              }
            }

            @override
            Widget build(BuildContext context) {
              final size = MediaQuery.of(context).size;
              final box = size.width * 0.72;

              return Scaffold(
                backgroundColor: Colors.black,
                appBar: AppBar(
                  backgroundColor: Colors.black,
                  title: const Text('مسح الباركود'),
                  actions: [
                    IconButton(
                      tooltip: 'الفلاش',
                      icon: ValueListenableBuilder<MobileScannerState>(
                        valueListenable: _controller,
                        builder: (_, state, __) => Icon(
                          state.torchState == TorchState.on
                              ? Icons.flash_on
                              : Icons.flash_off,
                          color: state.torchState == TorchState.on
                              ? AppColors.warning
                              : Colors.white70,
                        ),
                      ),
                      onPressed: () => _controller.toggleTorch(),
                    ),
                    IconButton(
                      tooltip: 'تبديل الكاميرا',
                      icon: const Icon(Icons.cameraswitch, color: Colors.white70),
                      onPressed: () => _controller.switchCamera(),
                    ),
                  ],
                ),
                body: Stack(
                  fit: StackFit.expand,
                  children: [
                    MobileScanner(
                      controller: _controller,
                      onDetect: _onDetect,
                      errorBuilder: (context, error, child) => Center(
                        child: Padding(
                          padding: const EdgeInsets.all(24),
                          child: Text(
                            error.errorCode == MobileScannerErrorCode.permissionDenied
                                ? 'لازم تسمح للتطبيق باستخدام الكاميرا من إعدادات الجهاز'
                                : 'تعذر تشغيل الكاميرا',
                            textAlign: TextAlign.center,
                            style: const TextStyle(color: Colors.white, fontSize: 16),
                          ),
                        ),
                      ),
                    ),
                    // إطار التوجيه
                    Center(
                      child: Container(
                        width: box,
                        height: box * 0.6,
                        decoration: BoxDecoration(
                          border: Border.all(color: AppColors.accentBlue, width: 2.5),
                          borderRadius: BorderRadius.circular(14),
                        ),
                      ),
                    ),
                    const Positioned(
                      bottom: 60,
                      left: 0,
                      right: 0,
                      child: Text(
                        'وجّه الكاميرا ناحية الباركود',
                        textAlign: TextAlign.center,
                        style: TextStyle(color: Colors.white70, fontSize: 15),
                      ),
                    ),
                  ],
                ),
              );
            }
          }
